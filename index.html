<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f7f5ec">
  <meta name="description" content="A tiny botanical multitouch game to decide who goes first.">
  <title>Who Goes First? — A Tiny Garden Game</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">✿</div>
      <div class="brand-copy">
        <p class="eyebrow">A TINY GARDEN GAME</p>
        <h1>Who goes first<span>?</span></h1>
      </div>
      <button id="sound-toggle" class="icon-button" type="button" aria-label="Turn sound off" title="Toggle sound">
        <span id="sound-icon" aria-hidden="true">♫</span>
      </button>
    </header>

    <section class="intro" aria-live="polite">
      <p id="status-title" class="status-title">Gather your players</p>
      <p id="status-detail" class="status-detail">Everyone, place one finger anywhere in the garden.</p>
    </section>

    <section id="garden" class="garden" aria-label="Touch garden. Place one finger per player." role="application">
      <div class="garden-hint" id="garden-hint">
        <span class="hint-sparkle">✧</span>
        <span>One finger each<br><b>2–6 players</b></span>
      </div>
      <div class="garden-ground" aria-hidden="true"></div>
      <div id="plants-layer" class="plants-layer"></div>
      <div id="countdown" class="countdown" aria-live="assertive" aria-atomic="true"></div>
      <div id="result-banner" class="result-banner" aria-live="assertive"></div>
    </section>

    <footer class="controls">
      <div class="player-count"><span class="count-dot"></span><span id="player-count">0 players joined</span></div>
      <button id="reset-button" class="reset-button" type="button">
        <span aria-hidden="true">↻</span> Play again
      </button>
    </footer>
    <p class="footer-note">Made for little decisions and big adventures.</p>
    <p class="attribution">App created by Isabella Navarro, MD. <span>Latest version October 2026.</span> <a href="mailto:isaymotion@gmail.com">isaymotion@gmail.com</a></p>
    <div id="announcement" class="sr-only" aria-live="polite"></div>
  </main>
  <script src="./app.js" defer></script>
</body>
</html>

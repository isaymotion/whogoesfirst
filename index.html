<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17251f" id="theme-color-meta">
  <meta name="description" content="A tiny botanical multitouch game to decide who goes first.">
  <title>Who Goes First? — A Tiny Garden Game</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <script>try{document.documentElement.dataset.theme=localStorage.getItem("who-goes-first-theme")||"dark"}catch(_){document.documentElement.dataset.theme="dark"}</script>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand-mark" aria-hidden="true">✿</div>
      <div class="brand-copy">
        <p class="eyebrow">A TINY GARDEN GAME</p>
        <h1>Who goes first<span>?</span></h1>
      </div>
      <div class="audio-controls" role="group" aria-label="Display and feedback settings">
        <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="Switch to light mode" aria-pressed="true" title="Switch theme">
          <span id="theme-icon" aria-hidden="true">☼</span>
        </button>
        <button id="sound-toggle" class="icon-button" type="button" aria-label="Turn sound off" aria-pressed="true" title="Toggle sound">
          <span id="sound-icon" aria-hidden="true">♫</span>
        </button>
        <button id="vibration-toggle" class="icon-button" type="button" aria-label="Turn vibration off" aria-pressed="true" title="Toggle vibration">
          <span id="vibration-icon" aria-hidden="true">〰</span>
        </button>
      </div>
    </header>

    <section class="intro">
      <p id="status-title" class="status-title" role="status" aria-live="polite" aria-atomic="true">Gather your players</p>
      <p id="status-detail" class="status-detail">Everyone, place one finger anywhere in the garden.</p>
    </section>

    <section id="garden" class="garden" aria-label="Touch garden" aria-describedby="garden-hint status-detail" role="application" tabindex="0">
      <div class="garden-hint" id="garden-hint">
        <span class="hint-sparkle">✧</span>
        <span>One finger each<br><b>2–6 players</b></span>
      </div>
      <div class="garden-ground" aria-hidden="true"></div>
      <div id="plants-layer" class="plants-layer"></div>
      <div id="countdown" class="countdown" aria-live="assertive" aria-atomic="true"></div>
      <div id="result-banner" class="result-banner" aria-live="assertive"></div>
    </section>

    <footer class="controls">
      <div class="player-count"><span class="count-dot" aria-hidden="true"></span><span id="player-count" aria-live="polite" aria-atomic="true">0 / 6 players joined</span></div>
      <button id="reset-button" class="reset-button" type="button" aria-label="Play again and reset the garden">
        <span aria-hidden="true">↻</span> Play again
      </button>
    </footer>
    <p class="footer-note">Made for little decisions and big adventures.</p>
    <p class="attribution">App created by Isabella Navarro, MD. <span>Latest version October 2026.</span> <a href="mailto:isaymotion@gmail.com">isaymotion@gmail.com</a></p>
    <div id="announcement" class="sr-only" aria-live="polite"></div>
  </main>
  <script src="./app.js" defer></script>
  <script>
    // Service workers require HTTPS (GitHub Pages qualifies) or localhost.
    // Resolve relative to this page so project-site paths work correctly.
    if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register(new URL("./sw.js", document.baseURI), { scope: new URL("./", document.baseURI).pathname, updateViaCache: "none" })
          .catch(error => console.warn("Offline support could not be enabled:", error));
      });
    }
  </script>
</body>
</html>
